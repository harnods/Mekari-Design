<body>
  <header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"><img src="assets/airene-default.png" alt=""></span>Airene Mascot Mixer</div></header>
  <main class="app">

      </section>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">PNG downloaded</div>
  <script>

    const mascotSelection="__mascot__",mascotTransform={dx:0,dy:0,scale:1};
    const state={mascot:"pink-cloud",active:[],selected:null,transforms:{}},preview=document.querySelector("#mascotPreview"),stage=document.querySelector("#stage"),composition=document.querySelector("#composition"),accessoryClip=document.querySelector("#accessoryClip"),mascotGrid=document.querySelector("#mascotGrid"),accessoryGrid=document.querySelector("#accessoryGrid"),layersPanel=document.querySelector("#layersPanel"),layerList=document.querySelector("#layerList"),safeArea=document.querySelector("#safeArea"),transformBox=document.querySelector("#transformBox"),objectRemove=document.querySelector("#objectRemove"),objectRotate=document.querySelector("#objectRotate"),objectScale=document.querySelector("#objectScale");

    function removeAccessory(id){state.active=state.active.filter(itemId=>itemId!==id);if(state.selected===id)state.selected=null;syncAccessories()}
    function selectAccessory(item){const index=state.active.indexOf(item.id);if(index>=0){if(editable(item)){state.selected=item.id;syncAccessories()}else removeAccessory(item.id);return}let replaced=null;if(item.id==="hard-hat"&&state.active.includes("headphones")){state.active=state.active.filter(id=>id!=="headphones");replaced="Headset replaced by Hard Hat"}if(item.id==="headphones"&&state.active.includes("hard-hat")){state.active=state.active.filter(id=>id!=="hard-hat");replaced="Hard Hat replaced by Headset"}if(state.active.length>=3){showToast("Maximum 3 accessories");return}state.active.push(item.id);state.selected=editable(item)?item.id:null;if(replaced)setTimeout(()=>showToast(replaced),0);syncAccessories()}

    mascots.forEach(([id,name])=>{const button=document.createElement("button");button.className="mascot-choice";button.type="button";button.setAttribute("aria-label",name);button.setAttribute("aria-pressed",String(id===state.mascot));button.innerHTML=`<img src="assets/mascots/${id}.png?v=14" alt="" loading="lazy"><span>${name}</span>`;button.addEventListener("click",()=>{state.mascot=id;document.querySelector("#previewName").textContent=name;[...mascotGrid.children].forEach((node,index)=>node.setAttribute("aria-pressed",String(mascots[index][0]===id)));repositionLayers();updatePreview()});mascotGrid.append(button)});

    function selectedGeometry(item,event){const rect=composition.getBoundingClientRect(),box=resolvedPlacement(item),transform=state.transforms[item.id],centerX=rect.left+(box.x+box.w/2+transform.dx)*rect.width,centerY=rect.top+(box.y+box.h/2+transform.dy)*rect.height;return{rect,transform,centerX,centerY,distance:Math.max(1,Math.hypot(event.clientX-centerX,event.clientY-centerY)),angle:Math.atan2(event.clientY-centerY,event.clientX-centerX)}}
    function startDrag(event,item,layer){event.preventDefault();event.stopPropagation();if(state.selected!==item.id){state.selected=item.id;syncAccessories()}layer.setPointerCapture(event.pointerId);layer.classList.add("is-dragging");const transform=state.transforms[item.id];gesture={mode:"drag",item,layer,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,dx:transform.dx,dy:transform.dy}}
    function startMascotDrag(event){event.preventDefault();event.stopPropagation();if(state.selected!==mascotSelection){state.selected=mascotSelection;syncAccessories()}preview.setPointerCapture(event.pointerId);preview.classList.add("is-dragging");gesture={mode:"drag",kind:"mascot",layer:preview,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,dx:mascotTransform.dx,dy:mascotTransform.dy}}
    function startHandleGesture(event,mode){event.preventDefault();event.stopPropagation();event.currentTarget.setPointerCapture(event.pointerId);if(state.selected===mascotSelection){if(mode!=="scale")return;const rect=composition.getBoundingClientRect(),centerX=rect.left+(mascotFrame.x+mascotFrame.w/2+mascotTransform.dx)*rect.width,centerY=rect.top+(mascotFrame.y+mascotFrame.h/2+mascotTransform.dy)*rect.height,distance=Math.max(1,Math.hypot(event.clientX-centerX,event.clientY-centerY));gesture={mode,kind:"mascot",layer:preview,pointerId:event.pointerId,startScale:mascotTransform.scale,startDistance:distance,centerX,centerY};return}const item=accessories.find(entry=>entry.id===state.selected);if(!item)return;const geometry=selectedGeometry(item,event);gesture={mode,kind:"accessory",item,layer:composition.querySelector(`[data-accessory="${item.id}"]`),pointerId:event.pointerId,startScale:geometry.transform.scale,startRotation:geometry.transform.rotation,startDistance:geometry.distance,startAngle:geometry.angle,centerX:geometry.centerX,centerY:geometry.centerY}}
    composition.addEventListener("pointermove",event=>{if(!gesture||event.pointerId!==gesture.pointerId)return;const rect=composition.getBoundingClientRect(),transform=gesture.kind==="mascot"?mascotTransform:state.transforms[gesture.item.id];if(gesture.mode==="drag"){transform.dx=gesture.dx+(event.clientX-gesture.startX)/rect.width;transform.dy=gesture.dy+(event.clientY-gesture.startY)/rect.height}else if(gesture.mode==="scale"){const distance=Math.hypot(event.clientX-gesture.centerX,event.clientY-gesture.centerY);transform.scale=gesture.startScale*distance/gesture.startDistance}else{const angle=Math.atan2(event.clientY-gesture.centerY,event.clientX-gesture.centerX);transform.rotation=gesture.startRotation+(angle-gesture.startAngle)*180/Math.PI}if(gesture.kind==="mascot")placeMascot();else placeLayer(gesture.item,gesture.layer)});
    function endGesture(event){if(!gesture||event.pointerId!==gesture.pointerId)return;gesture.layer.classList.remove("is-dragging");gesture=null}
    composition.addEventListener("pointerup",endGesture);composition.addEventListener("pointercancel",endGesture);
    preview.addEventListener("pointerdown",startMascotDrag);preview.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();state.selected=mascotSelection;syncAccessories()}});
    objectScale.addEventListener("pointerdown",event=>startHandleGesture(event,"scale"));
    objectRotate.addEventListener("pointerdown",event=>startHandleGesture(event,"rotate"));
    objectRemove.addEventListener("pointerdown",event=>{event.preventDefault();event.stopPropagation()});
    objectRemove.addEventListener("click",()=>{if(state.selected)removeAccessory(state.selected)});
    stage.addEventListener("pointerdown",event=>{if(event.target.closest(".accessory-layer,.transform-box"))return;state.selected=null;syncAccessories()});
    document.querySelector("#clearAll").addEventListener("click",()=>{state.active=[];state.selected=null;syncAccessories()});
    function drawMascot(context,image,canvas){const targetW=mascotFrame.w*canvas.width,targetH=mascotFrame.h*canvas.height,fit=Math.min(targetW/image.naturalWidth,targetH/image.naturalHeight),width=image.naturalWidth*fit*mascotTransform.scale,height=image.naturalHeight*fit*mascotTransform.scale,centerX=(mascotFrame.x+mascotFrame.w/2+mascotTransform.dx)*canvas.width,centerY=(mascotFrame.y+mascotFrame.h/2+mascotTransform.dy)*canvas.height;context.drawImage(image,centerX-width/2,centerY-height/2,width,height)}
    function drawTransformedContained(context,image,item,canvas){const box=resolvedPlacement(item),transform=state.transforms[item.id],targetW=box.w*canvas.width,targetH=box.h*canvas.height,fit=Math.min(targetW/image.naturalWidth,targetH/image.naturalHeight),width=image.naturalWidth*fit,height=image.naturalHeight*fit,centerX=(box.x+box.w/2+transform.dx)*canvas.width,centerY=(box.y+box.h/2+transform.dy)*canvas.height;context.save();context.translate(centerX,centerY);context.rotate(transform.rotation*Math.PI/180);context.scale(transform.scale,transform.scale);context.drawImage(image,-width/2,-height/2,width,height);context.restore()}
    document.querySelector("#download").addEventListener("click",async()=>{const canvas=document.createElement("canvas");canvas.width=960;canvas.height=960;const context=canvas.getContext("2d",{alpha:true});context.clearRect(0,0,canvas.width,canvas.height);context.save();context.beginPath();context.rect(0,0,canvas.width,canvas.height);context.clip();const mascot=new Image();mascot.src=preview.dataset.full||preview.src;await mascot.decode();drawMascot(context,mascot,canvas);for(const id of state.active){if(generatedVariants.has(id))continue;const item=accessories.find(entry=>entry.id===id),image=new Image();image.src=item.src;await image.decode();drawTransformedContained(context,image,item,canvas)}context.restore();const link=document.createElement("a");link.download=`airene-${state.mascot}${state.active.length?"-"+state.active.join("-"):""}.png`;link.href=canvas.toDataURL("image/png");link.click();showToast("PNG downloaded")});
  </script>
</body>
