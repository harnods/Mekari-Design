<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airene Green Block Fixed Render</title>
  <meta name="description" content="Fixed-pose Green Block sample using the original Airene artwork.">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#f4f4f2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-rows:64px 1fr}
    header{display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #dedede;background:#fff}
    .brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:760}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#111;color:#fff;font-weight:850}
    main{min-height:0;padding:28px;display:grid;place-items:center}.sample{width:min(900px,100%)}
    .sample-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.sample-header h1{margin:0;font-size:18px}.sample-header span{color:#737373;font-size:13px}
    .stage{width:100%;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;border:1px solid #dedede;border-radius:8px;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.07)}
    .stage img{display:block;width:84%;height:84%;object-fit:contain;user-select:none;filter:url(#surfaceTexture)}
    .note{margin:12px 0 0;color:#737373;font-size:13px;text-align:right}
    @media(max-width:600px){header{padding:0 16px}.brand span:last-child{display:none}main{padding:16px}.sample-header span{display:none}.stage img{width:94%;height:94%}.note{text-align:left}}
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="surfaceTexture" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".13 0 0 0 .435  0 .13 0 0 .435  0 0 .13 0 .435  0 0 0 .12 0" result="softNoise"/>
      <feComposite in="softNoise" in2="SourceAlpha" operator="in" result="maskedNoise"/>
      <feBlend in="SourceGraphic" in2="maskedNoise" mode="soft-light"/>
    </filter>
  </svg>
  <div class="shell">
    <header><div class="brand"><span class="mark" aria-hidden="true">A</span><span>Airene Fixed Render Sample</span></div></header>
    <main>
      <section class="sample" aria-labelledby="sampleTitle">
        <div class="sample-header"><h1 id="sampleTitle">Green Block</h1><span>Original Airene artwork</span></div>
        <div class="stage"><img src="assets/mascots/green-block.png" alt="Green Block Airene mascot in its original fixed pose"></div>
        <p class="note">Fixed pose · Original material, lighting, and subtle surface grain</p>
      </section>
    </main>
  </div>
</body>
</html>
