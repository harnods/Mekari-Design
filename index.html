<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mekari Pixel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234539BC'/></svg>">
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #ffffff;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #logo {
      width: min(46vw, 340px);
      height: auto;
      display: block;
    }
    /* pixel squares of the icon */
    #logo .px {
      opacity: 0;
      transform: scale(0.1);
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }
    #logo .px.in {
      animation:
        pop 0.5s cubic-bezier(0.22, 1.2, 0.36, 1) forwards var(--d, 0s),
        shimmer 5.5s ease-in-out infinite var(--s, 3s);
    }
    @keyframes pop {
      0%   { opacity: 0; transform: scale(0.1); }
      70%  { opacity: 1; transform: scale(1.12); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0%, 86%, 100% { transform: scale(1); filter: none; }
      90%  { transform: scale(1.18); filter: brightness(1.25); }
      94%  { transform: scale(1); filter: none; }
    }
    /* wordmark letters */
    #logo .txt {
      opacity: 0;
      transform: translateY(6px);
      transform-box: fill-box;
      transform-origin: center;
    }
    #logo .txt.in {
      animation: fadeUp 0.6s ease forwards var(--d, 0s);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #logo .px, #logo .txt { opacity: 1 !important; transform: none !important; animation: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var svg = document.getElementById("logo");
      var paths = Array.prototype.slice.call(svg.querySelectorAll("path"));
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Icon pixel squares use purple fills; the wordmark letters are black / gray.
      var pixelFills = ["#4539BC", "#6D48E5", "#533FC9", "#5E41D8", "#9176D7"];

      var pixels = [], letters = [];
      paths.forEach(function (p) {
        var f = (p.getAttribute("fill") || "").toUpperCase();
        if (pixelFills.indexOf(f) !== -1) pixels.push(p);
        else letters.push(p);
      });

      if (reduce) return;

      // Order pixels left-to-right (by x) with a touch of randomness for an organic build-up.
      pixels.forEach(function (p) {
        var b = p.getBBox();
        p._x = b.x + b.y * 0.15;
      });
      pixels.sort(function (a, b) { return a._x - b._x; });

      var span = pixels.length;
      pixels.forEach(function (p, i) {
        var base = (i / span) * 0.9;              // left-to-right sweep over ~0.9s
        var jitter = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 0.08; // deterministic pseudo-random
        var d = base + Math.abs(jitter);
        p.style.setProperty("--d", d.toFixed(3) + "s");
        // shimmer ripple starts after assemble, staggered by x position
        p.style.setProperty("--s", (1.6 + (i / span) * 1.2).toFixed(3) + "s");
        p.classList.add("px");
        // force reflow-safe add of animation class
        requestAnimationFrame(function () { p.classList.add("in"); });
      });

      // Wordmark letters fade up after the icon has assembled.
      letters.forEach(function (p, i) {
        p.style.setProperty("--d", (1.05 + i * 0.05).toFixed(3) + "s");
        p.classList.add("txt");
        requestAnimationFrame(function () { p.classList.add("in"); });
      });
    })();
  </script>
