<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mekari Design</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0c0e;
        color: #f5f5f7;
      }
      main { text-align: center; }
      h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 0.5rem; }
      p { opacity: 0.7; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World 👋</h1>
      <p>Mekari Design</p>
    </main>
  </body>
</html>
